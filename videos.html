<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vídeos | Made in Brazil</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Poppins,sans-serif;
background:#050505;
color:#fff;
overflow-x:hidden;
}

/* HEADER FIXADO (PADRÃO IGUAL OUTRAS PÁGINAS) */
.topbar{
position:sticky;
top:0;
z-index:1000;

display:flex;
justify-content:flex-end; /* 🔥 botão no canto direito */
align-items:center;

padding:14px 40px;

background:rgba(10,10,10,.55);
backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,223,0,.08);
}

/* BOTÃO PADRÃO */
.btn{
padding:14px 28px;
border-radius:14px;
text-decoration:none;
font-weight:700;
background:linear-gradient(45deg,#009739,#FFDF00);
color:#000;
transition:.3s;
display:inline-block;
}

.btn:hover{
transform:translateY(-3px);
box-shadow:0 0 25px rgba(255,223,0,.3);
}

/* HERO */
.hero{
padding:50px 20px 20px;
text-align:center;
}

.hero h1{
font-family:Cinzel,serif;
font-size:3.5rem;
background:linear-gradient(90deg,#009739,#FFDF00,#002776);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
text-shadow:0 0 20px rgba(255,223,0,.1);
}

.hero p{
opacity:.8;
margin-top:10px;
}

/* CATEGORIAS */
.categories{
display:flex;
justify-content:center;
gap:10px;
margin:25px 0;
flex-wrap:wrap;
}

.cat{
padding:8px 14px;
border-radius:20px;
background:#111;
border:1px solid rgba(255,255,255,.08);
cursor:pointer;
font-size:.85rem;
transition:.3s;
}

.cat:hover{
border-color:#FFDF00;
transform:translateY(-2px);
}

.cat.active{
background:rgba(255,223,0,.15);
border-color:#FFDF00;
color:#FFDF00;
}

/* SEARCH */
.search-box{
display:flex;
justify-content:center;
margin:15px 0 30px;
}

.search-box input{
width:100%;
max-width:600px;
padding:14px 18px;
border-radius:12px;
background:#0f0f0f;
border:1px solid rgba(255,223,0,.1);
color:#fff;
outline:none;
}

/* GRID */
.grid-wrapper{
position:relative;
padding:0 4%;
}

.grid{
display:grid;
grid-template-columns:repeat(5, 1fr);
gap:16px;
padding-bottom:60px;
}

/* RESPONSIVO */
@media(max-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.grid{grid-template-columns:1fr}}

/* CARD */
.card{
background:#111;
border-radius:14px;
overflow:hidden;
cursor:pointer;

border:1px solid rgba(255,255,255,.05);
transition:.35s;
}

.card:hover{
transform:scale(1.08);
border-color:rgba(255,223,0,.25);
box-shadow:0 20px 40px rgba(0,0,0,.6);
z-index:2;
}

.thumb{position:relative}

.thumb img{
width:100%;
height:140px;
object-fit:cover;
transition:.3s;
}

.card:hover img{
transform:scale(1.1);
filter:brightness(.6);
}

.play{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:50px;
height:50px;
border-radius:50%;
background:rgba(0,0,0,.6);
display:flex;
align-items:center;
justify-content:center;
color:#FFDF00;
opacity:0;
transition:.3s;
}

.card:hover .play{opacity:1}

.card h3{
padding:12px;
font-size:.9rem;
color:#FFDF00;
text-align:center;
}

/* ARROWS */
.arrow{
position:absolute;
top:40%;
transform:translateY(-50%);
width:36px;
height:36px;
border:none;
border-radius:50%;
cursor:pointer;
background:rgba(0,0,0,.4);
color:#FFDF00;
opacity:.4;
transition:.3s;
}

.arrow:hover{
opacity:1;
background:rgba(255,223,0,.15);
transform:translateY(-50%) scale(1.1);
}

.arrow.left{left:6px}
.arrow.right{right:6px}

/* MODAL */
.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.92);
justify-content:center;
align-items:center;
z-index:9999;
}

.modal-content{
width:min(900px,95vw);
aspect-ratio:16/9;
}

iframe{
width:100%;
height:100%;
border-radius:12px;
}

.close{
position:absolute;
top:20px;
right:25px;
font-size:40px;
cursor:pointer;
color:#fff;
}

/* FOOTER */
footer{
text-align:center;
padding:25px;
opacity:.6;
}

/* HIDE */
.hide{display:none !important}

</style>
</head>

<body>

<header class="topbar">
<a href="index.html" class="btn">← Voltar</a>
</header>

<section class="hero">
<h1>Biblioteca de Vídeos</h1>
<p>Tutoriais, MVPs, WoE e conteúdos da guilda</p>
</section>

<div class="categories">
<div class="cat active" onclick="filter('all',this)">Todos</div>
<div class="cat" onclick="filter('woe',this)">WoE</div>
<div class="cat" onclick="filter('mvp',this)">MVP</div>
<div class="cat" onclick="filter('build',this)">Builds</div>
</div>

<div class="search-box">
<input type="text" id="searchVideos" placeholder="Pesquisar vídeos..." onkeyup="searchVideos()">
</div>

<div class="grid-wrapper">

<button class="arrow left" onclick="scrollGrid(-400)">‹</button>

<div class="grid" id="grid">

<div class="card" data-cat="woe" onclick="openVideo('dQw4w9WgXcQ')">
<div class="thumb"><img src="thumbs/video1.png"><div class="play">▶</div></div>
<h3>Guia WoE</h3>
</div>

<div class="card" data-cat="mvp" onclick="openVideo('dQw4w9WgXcQ')">
<div class="thumb"><img src="thumbs/video2.png"><div class="play">▶</div></div>
<h3>MVP Thanatos</h3>
</div>

<div class="card" data-cat="build" onclick="openVideo('dQw4w9WgXcQ')">
<div class="thumb"><img src="thumbs/video3.png"><div class="play">▶</div></div>
<h3>Build Arcebispo</h3>
</div>

<div class="card" data-cat="build" onclick="openVideo('dQw4w9WgXcQ')">
<div class="thumb"><img src="thumbs/video4.png"><div class="play">▶</div></div>
<h3>Equipamentos</h3>
</div>

<div class="card" data-cat="mvp" onclick="openVideo('dQw4w9WgXcQ')">
<div class="thumb"><img src="thumbs/video1.png"><div class="play">▶</div></div>
<h3>Outro Vídeo</h3>
</div>

</div>

<button class="arrow right" onclick="scrollGrid(400)">›</button>

</div>

<div class="modal" id="modal">
<span class="close" onclick="closeVideo()">×</span>
<div class="modal-content">
<iframe id="player" src="" allowfullscreen></iframe>
</div>
</div>

<footer>© 2026 Made in Brazil</footer>

<script>

const modal=document.getElementById("modal");
const player=document.getElementById("player");
const grid=document.getElementById("grid");

function openVideo(id){
player.src="https://www.youtube.com/embed/"+id;
modal.style.display="flex";
}

function closeVideo(){
player.src="";
modal.style.display="none";
}

modal.addEventListener("click",e=>{
if(e.target===modal) closeVideo();
});

function scrollGrid(amount){
grid.scrollBy({left:amount,behavior:"smooth"});
}

function searchVideos(){
const value=document.getElementById("searchVideos").value.toLowerCase();
document.querySelectorAll(".card").forEach(card=>{
const title=card.querySelector("h3").textContent.toLowerCase();
card.classList.toggle("hide", !title.includes(value));
});
}

function filter(cat,el){
document.querySelectorAll(".cat").forEach(c=>c.classList.remove("active"));
el.classList.add("active");

document.querySelectorAll(".card").forEach(card=>{
card.classList.toggle("hide", cat!=='all' && card.dataset.cat!==cat);
});
}

</script>

</body>
</html>
